name: Update Item Data

on:
  schedule:
    - cron: '0 */3 * * *' # 3시간마다 자동 실행 (pet_data와 동일 주기)
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

# 동시에 여러 개가 돌면 같은 브랜치에 push 경쟁이 생겨서 실패할 수 있음.
# 이미 실행 중이면 새로 트리거된 건 취소하지 않고 대기열에 넣어 순서대로 실행.
concurrency:
  group: update-item-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest item data from sa000001.com
        run: |
          curl -sf "https://sa000001.com/sa2/info/data/itemset6.txt" -o itemset6.txt
          echo "아이템 데이터 다운로드 완료, 크기:"
          wc -c itemset6.txt
          curl -sf "https://sa000001.com/sa2/info/data/magic.txt" -o magic.txt
          echo "주술 데이터 다운로드 완료, 크기:"
          wc -c magic.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add itemset6.txt magic.txt
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 스킵"
            exit 0
          fi
          git commit -m "아이템 데이터 자동 업데이트 $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패 (시도 $i/5) - 최신 내역 받아서 재시도합니다"
            git fetch origin main
            git rebase origin/main || { echo "rebase 충돌 - 수동 확인 필요"; exit 1; }
            sleep $((i * 3))
          done
          echo "5번 재시도했지만 push 실패"
          exit 1
